name: First Encounter proof

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:radio-isolation
      - run: node --check scripts/humkin-accident-intake.mjs
      - run: node --test scripts/humkin-accident-intake.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: the-static-collective/MOTIF
          ref: 9593b0b8e1f9e70bfc09e72adc49ee64e567609b
          path: motif-reference
      - run: node --check scripts/motif-accident-lab.mjs
      - run: node --test scripts/motif-accident-lab.test.mjs
        env:
          MOTIF_REPO: ${{ github.workspace }}/motif-reference
          MOTIF_PYTHON: python3
      - run: node --check scripts/accident-return-core.mjs
      - run: node --check scripts/accident-return-loop.mjs
      - run: node --test scripts/accident-return-loop.test.mjs
        env:
          MOTIF_REPO: ${{ github.workspace }}/motif-reference
          MOTIF_PYTHON: python3
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: node --check scripts/render-radio-master.mjs
      - run: node --test scripts/render-radio-master.test.mjs
      - run: bun run lint
